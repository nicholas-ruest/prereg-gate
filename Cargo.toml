[package]
name = "prereg-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Evidence-gated verdicts for preregistered experiments"
license = "MIT"
repository = "https://github.com/nicholas-ruest/prereg-gate"
readme = "README.md"
keywords = ["reproducibility", "experiments", "cli", "science"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
